server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /index.htm { return 301 /; }
    location = /about-us.html { return 301 /about-us/; }
    location ~ ^/service/([^/]+)\.html$ { return 301 /service/$1/; }
    location ~ ^/pages/blog-detail/([^/]+)\.html$ { return 301 /blog-detail/$1/; }

    error_page 404 /404.html;

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
