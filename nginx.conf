server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Master URL shape: old stage /services/<slug>/ -> /service/<slug>/ (permanent)
    rewrite ^/services/(web-development|branding-and-identity|smart-growth-marketing|cms-solution|mobile-application|media-creation-services|ai-powered-business-solutions)/$ /service/$1 permanent;
    rewrite ^/services/web-design/$ /service/branding-design permanent;

    rewrite ^(/pages/blog\-detail/complete\-step\-by\-step\-guide\-to\-installing\-and\-setting\-up\-coolify\-on\-a\-vps|/pages/blog\-detail/how\-to\-install\-typo3\-v13\-lts\-using\-composer\-step\-by\-step\-guide|/pages/blog\-detail/typo3\-v14\-lts\-the\-next\-generation\-of\-enterprise\-cms|/pages/blog\-detail/whats\-new\-in\-typo3\-v14\-a\-complete\-overview\-for\-2025|/service/ai\-powered\-business\-solutions|/service/media\-creation\-services|/business\-development\-executive|/service/smart\-growth\-marketing|/service/branding\-and\-identity|/service/mobile\-application|/service/branding\-design|/service/web\-development|/service/cms\-solution|/front\-end\-developer|/ui\-ux\-designer|/seo\-executive|/portfolio|/about\-us|/services|/careers|/contact|/blogs)/$ $1 permanent;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
