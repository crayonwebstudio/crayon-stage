<svg xmlns="http://www.w3.org/2000/svg" width="1558" height="841" viewBox="0 0 1558 841" fill="none">
  <!-- New decorative shapes derived from the Crayon bird logo: angular facets
       like the bird body polygons, in the brand dark grey, with the primary
       yellow #FCD16E triangles that echo the logo's yellow accents.
       Transparent background. Positions match the old head_shaps sheet:
       dark facet at the left edge, yellow facet near the centre-right. -->
  <!-- Dark facet, left edge (replaces the old black half-round) -->
  <polygon points="0,520 72,520 58,610 0,640" fill="#242424"/>
  <polygon points="72,520 110,545 58,610" fill="#3A3A3A"/>
  <polygon points="110,545 132,520 118,560" fill="#FCD16E"/>
  <!-- Yellow facet cluster, centre-right (replaces the old orange half-round) -->
  <polygon points="520,560 620,560 570,650 520,650" fill="#FCD16E"/>
  <polygon points="620,560 665,600 570,650" fill="#E8B84B"/>
  <polygon points="520,560 545,600 520,650" fill="#242424"/>
  <polygon points="665,600 690,580 675,615" fill="#242424"/>
  <!-- Small yellow dots, echoing the logo's yellow accents -->
  <circle cx="760" cy="540" r="7" fill="#FCD16E"/>
  <circle cx="790" cy="570" r="5" fill="#FCD16E"/>
</svg>
